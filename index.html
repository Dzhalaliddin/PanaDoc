    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 15px;
  }
  .btn:hover { background: #1a4fa8; }
  .btn:disabled { background: #8aa9dd; cursor: wait; }
  .btn-secondary { background: #fff; color: #2a6fdb; border: 2px solid #2a6fdb; }
  .btn-secondary:hover { background: #eef3fc; }
  .btn-clear { background: #fff; color: #d32f2f; border: 2px solid #d32f2f; }

  .btn-row { display: flex; gap: 10px; margin-top: 15px; }
  .btn-row .btn { margin-top: 0; }
  .status {
    margin-top: 15px;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  .status.ok { background: #e6f4ea; color: #1e7d38; display: block; }
  .status.err { background: #fdecea; color: #b71c1c; display: block; }
  .status.info { background: #eef3fc; color: #1a3d6d; display: block; }

    color: #1a3d6d;
    margin-bottom: 15px;

function todayLocal() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}

function getValue(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function formatDateRu(isoDate) {
  if (!isoDate) return t.blank;
  // Разбираем строку вручную, чтобы не было сдвига дня из-за часового пояса
  const parts = isoDate.split('-');
  return t.date(parseInt(parts[2], 10), t.months[parseInt(parts[1], 10) - 1], parseInt(parts[0], 10));
}

// ============ СЛЕДУЮЩИЙ НОМЕР ============
async function fetchNextNumber() {
  const loc = getValue('location');
  if (!loc || !LOCATIONS[loc]) return;

  const status = document.getElementById('status');
  status.className = 'status info';
  status.textContent = 'Запрос номера договора...';

  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=nextNumber&location=' + encodeURIComponent(loc));
    const data = await res.json();
    if (data.number) {
      document.getElementById('contractNumber').value = data.number;
      saveDraft();
      status.className = 'status ok';
      status.textContent = '✓ Номер договора: ' + data.number;
    } else {
      status.className = 'status err';
      status.textContent = 'Не удалось получить номер';
    }
  } catch (e) {
    status.className = 'status err';
    status.textContent = 'Нет связи с Google Таблицей';
  }
}

// ============ АВТОЗАПОЛНЕНИЕ ПО БИН/ИИН ============
let lastLookupBin = '';

async function lookupByBin() {
  const bin = getValue('companyBin');
  if (!/^\d{12}$/.test(bin) || bin === lastLookupBin) return;
  lastLookupBin = bin;

  const status = document.getElementById('status');
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=getByBin&bin=' + encodeURIComponent(bin));
    const r = await res.json();
    if (!r.found) return;
    if (!confirm('Клиент найден в реестре: ' + (r.companyName || bin) + '.\nПодставить его реквизиты?')) return;

    const map = {
      companyName: r.companyName, directorName: r.directorName, companyAddress: r.companyAddress,
      companyBank: r.companyBank, companyBik: r.companyBik, companyAccount: r.companyAccount,
      companyKbe: r.companyKbe, phone: r.phone
    };
    Object.keys(map).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = map[id] || '';
    });
    saveDraft();
    status.className = 'status ok';
    status.textContent = '✓ Реквизиты подставлены из реестра: ' + (r.companyName || bin);
  } catch (e) {
    // тихо игнорируем: автозаполнение — удобство, а не обязательная часть
  }
}

const DRAFT_FIELDS = ['location','contractNumber','contractDate','companyName','companyBin',
                     'directorName','directorBasis','companyAddress','companyBank','companyBik',
                     'companyAccount','companyKbe','phone'];

function saveDraft() {
  try {
    DRAFT_FIELDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) localStorage.setItem('draft_' + id, el.value);
    });
  } catch (e) {}
}

function loadDraft() {
  try {
    DRAFT_FIELDS.forEach(id => {
      const el = document.getElementById(id);
      const saved = localStorage.getItem('draft_' + id);
      if (el && saved && id !== 'contractDate') el.value = saved;  // дата всегда текущая
    });
  } catch (e) {}
}

function clearForm() {
  if (!confirm('Очистить все поля формы?')) return;
  DRAFT_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      if (id === 'docLang') { /* язык не сбрасываем */ }
      else if (id === 'directorBasis') el.value = '';
      else if (id === 'contractDate') el.value = todayLocal();
      else el.value = '';
    }
  });
  try { localStorage.clear(); } catch (e) {}
  saveDraft();
  document.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid'));
  lastRegisteredKey = '';
  lastLookupBin = '';
  document.getElementById('locInfo').className = 'loc-info';
  document.getElementById('discount').value = '';
  document.getElementById('status').className = 'status';
}

// ============ ПРОВЕРКА ЗАПОЛНЕНИЯ ============
const REQUIRED_FIELDS = {
  location: 'Локация', contractDate: 'Дата договора', companyName: 'Название организации',
  companyBin: 'БИН / ИИН', directorName: 'ФИО директора'
};

function validateForm() {
  const status = document.getElementById('status');
  document.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid'));
  const problems = [];
  const bad = [];
  Object.keys(REQUIRED_FIELDS).forEach(id => {
    const val = getValue(id);
    if (!val || (id === 'location' && !LOCATIONS[val])) {
      problems.push(REQUIRED_FIELDS[id]); bad.push(id);
    } else if (id === 'companyBin' && !/^\d{12}$/.test(val)) {
      problems.push('БИН / ИИН (нужно ровно 12 цифр)'); bad.push(id);
    }
  });
  if (!bad.length) return true;
  bad.forEach(id => document.getElementById(id).classList.add('invalid'));
  document.getElementById(bad[0]).focus();
  status.className = 'status err';
  status.textContent = 'Не заполнено: ' + problems.join(', ');
  return false;
}

// ============ ГЕНЕРАЦИЯ ============
let lastRegisteredKey = '';  // чтобы повторное скачивание того же договора не создавало дубль в реестре

async function generateAndDownload() {
  const status = document.getElementById('status');
  const btn = document.getElementById('downloadBtn');
  const loc = getValue('location');
  if (!langReady(getValue('docLang') || 'ru')) return;

  if (!validateForm()) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + U[curLang()].forming;

  // Если номера нет — получаем автоматически
  if (!getValue('contractNumber')) await fetchNextNumber();

  const data = getFormData();
  const key = JSON.stringify(data);
  let registered = true;
  let message = '✓ Договор сформирован и записан в реестр.';

  if (key !== lastRegisteredKey) {
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)   // text/plain — без preflight, ответ читается
      });
      const r = await res.json();
      if (r.status === 'ok') {
        if (r.number && r.number !== data.contractNumber) {
          // номер был занят — таблица выдала следующий свободный
          data.contractNumber = r.number;
          document.getElementById('contractNumber').value = r.number;
          saveDraft();
          message = '✓ Договор записан в реестр. Номер был занят, присвоен новый: ' + r.number;
        }
        lastRegisteredKey = JSON.stringify(getFormData());
      } else {
        registered = false;
      }
    } catch (e) {
      console.warn('Ошибка отправки:', e);
      registered = false;
    }
  } else {
    message = '✓ Договор сформирован повторно (запись в реестре уже есть).';
  }

  downloadWord(data);

  if (registered) {
    status.className = 'status ok';
    status.textContent = message;
  } else {
    status.className = 'status err';
    status.textContent = 'Договор скачан, но НЕ записан в реестр — проверьте связь и повторите.';
  }
  btn.disabled = false;
  btn.innerHTML = U[curLang()].dl;
}

// ============ ШАБЛОН «ПРЯМОЙ» ============
function buildDirect(d, L, dateRu, discountFactor, docTitle) {
  return `
<h1>${docTitle} № ${d.contractNumber}</h1>
<p>${L.city}</p>
<p>${dateRu}</p>

<p><span class="bold">${L.execFullName}</span>, именуемое в дальнейшем <span class="bold">«Исполнитель»</span>, в лице Директора ${L.execDirector}, действующего на основании ${BASIS}, с одной стороны, и</p>

<p><span class="bold">${d.companyName}</span>, именуемое в дальнейшем <span class="bold">«Заказчик»</span>, в лице ${d.directorName}, действующего на основании ${d.directorBasis}, с другой стороны,</p>

<p>совместно именуемые <span class="bold">«Стороны»</span>, заключили настоящий договор возмездного оказания гостиничных услуг (далее — <span class="bold">«Договор»</span>) о нижеследующем:</p>

<h2>1. Предмет договора</h2>
<p>1.1. По Договору Исполнитель обязуется по заявке Заказчика при наличии свободных мест оказать услуги по временному размещению гостей Заказчика (далее — <span class="bold">«Гость»</span> или <span class="bold">«Гости»</span>) в номерах гостиничного комплекса <span class="bold">«${L.hotelName}»</span>, расположенного по адресу: ${L.hotelAddress}, а Заказчик обязуется принять и оплатить оказанные услуги.</p>

<h2>2. Порядок и условия предоставления услуг</h2>
<p>2.1. Бронирование может быть совершено по электронной почте, телефону или через мессенджер WhatsApp.</p>
<p>2.2. Контакты для бронирования: e-mail: ${L.bookingEmail}, телефон: ${phoneLink(L.bookingPhone)}.</p>
<p>2.3. При бронировании необходимо внести ${L.paymentTerms.replace('100% предоплата', '100% предоплату')}.</p>
<p>2.4. Бронирование, изменение сроков проживания, отмена брони производятся на основании письменных заявок Заказчика.</p>
<p>2.5. В течение 24 (двадцати четырёх) часов после получения заявки Исполнитель направляет Заказчику подтверждение бронирования по электронной почте или WhatsApp.</p>
<p>2.6. Заявка должна содержать: количество прибывающих лиц с ФИО; сроки пребывания с датой и временем заезда/выезда; количество и тип номеров; требования по дополнительным услугам.</p>
<p>2.7. Условия отмены бронирования регулируются разделом 5 Договора.</p>
<p>2.8. Все дополнительные услуги, не указанные в Приложении к Договору, оплачиваются дополнительно.</p>
<p>2.9. Ранним заездом считается заселение до 14:00. Поздним выездом — выезд после 12:00. Ранний заезд и поздний выезд предоставляются при наличии свободных номеров и оплачиваются дополнительно в размере 50% стоимости номера за сутки (за каждую услугу).</p>
<p>2.10. Размещение менее 24 часов (day use) — полная суточная стоимость.</p>

<h2>7. Ответственность сторон</h2>
<p>7.1. Стороны несут ответственность в соответствии с законодательством РК.</p>
<p>7.2. При отсутствии номерного фонда для Гостей с подтверждённой заявкой Исполнитель за свой счёт предоставляет размещение того же или более высокого уровня.</p>
<p>7.3. При аннулировании заявки менее чем за 1 сутки до заезда с Заказчика взыскивается аннуляционный сбор в размере стоимости суток проживания.</p>
<p>7.4. За ущерб, причинённый Гостями, отвечает виновное лицо в гражданско-правовом порядке.</p>
<p>7.5. При неоказании или несвоевременном оказании услуг Исполнитель возвращает ранее оплаченные средства в течение 3 рабочих дней и возмещает документально подтверждённые убытки.</p>
<p>7.6. Антикоррупционная оговорка: Стороны проводят политику полной нетерпимости к взяточничеству и коррупции. В случае несоблюдения Исполнителем требований настоящего пункта Заказчик вправе расторгнуть Договор в одностороннем порядке без штрафных санкций.</p>
<p>7.7. Обработка персональных данных осуществляется в соответствии с законодательством РК.</p>
<p>7.8. Уступка прав по Договору третьим лицам без письменного согласия Заказчика запрещена. При нарушении — штраф 20% от общей суммы заказов за весь срок действия Договора.</p>

<h2>8. Конфиденциальность</h2>
<p>8.1. Стороны несут ответственность за сохранение конфиденциальности всей информации, полученной в течение выполнения Договора.</p>

<h2>9. Форс-мажор</h2>
<p>9.1. Стороны освобождаются от ответственности при наступлении обстоятельств непреодолимой силы.</p>
<p>9.2. К форс-мажору относятся: стихийные явления, военные действия, чрезвычайное положение, массовые заболевания, забастовки, изменения нормативных актов, ограничения перевозок и другие события, не зависящие от воли Сторон.</p>
<p>9.3. Пострадавшая Сторона обязана незамедлительно известить другую Сторону письменно.</p>
<p>9.4. Сведения подтверждаются документом уполномоченного органа РК.</p>
<p>9.5. Если форс-мажор длится более одного календарного месяца, Стороны договариваются о замене услуг или аннулировании обязательств с взаиморасчётом.</p>

<h2>10. Применимое право, порядок решения споров</h2>
<p>10.1. Споры урегулируются путём переговоров.</p>
<p>10.2. При недостижении согласия спор рассматривается в соответствии с законодательством РК по месту нахождения Заказчика.</p>

<h2>11. Срок действия Договора</h2>
<p>11.1. Договор вступает в силу с момента подписания и действует <span class="bold">бессрочно</span> до момента расторжения одной из Сторон.</p>
<p>11.2. Каждая Сторона вправе расторгнуть Договор в одностороннем порядке, уведомив другую Сторону письменно не менее чем за 15 (пятнадцать) календарных дней.</p>
<p>11.3. Бронирования, подтверждённые до даты расторжения, обслуживаются по тарифам, действовавшим на дату подтверждения, до фактического выезда Гостей.</p>

<h2>12. Дополнение условий Договора</h2>
<p>12.1. Изменения, дополнения и приложения совершаются в письменной форме за подписью уполномоченных представителей.</p>
<p>12.2. Расторжение Договора не освобождает Стороны от обязательств по оплате и возврату средств.</p>

<h2>13. Заключительные положения</h2>
<p>13.1. Договор подписан в 2 (двух) подлинных экземплярах на русском языке, по одному для каждой Стороны.</p>
<p>13.2. Возможно подписание по факсу (факсимильное воспроизведение подписи и печати).</p>
<p>13.3. С момента подписания все ранее существовавшие договорённости и переписка теряют силу.</p>

<p>5. Изменение дат возможно при наличии свободных номеров и согласовании не менее чем за ${L.cancelDays} дней.</p>

window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('contractDate').value = todayLocal();

  loadDraft();

  // Если локация уже выбрана (из черновика) — показываем инфо и подставляем свежий номер
  const loc = getValue('location');
  if (loc && LOCATIONS[loc]) {
    showLocationInfo(loc);
    fetchNextNumber();
  }

  DRAFT_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', saveDraft);
  });

  document.getElementById('companyBin').addEventListener('input', lookupByBin);
  Object.keys(REQUIRED_FIELDS).forEach(id => {
    const el = document.getElementById(id);
    ['input', 'change'].forEach(ev => el.addEventListener(ev, () => el.classList.remove('invalid')));
  });
});
</script>
