<title>Генератор договоров — PANA HOTELS</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    margin: 0;
    padding: 40px 20px;
    color: #222;
    transition: background 0.2s, color 0.2s;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    background: #fff;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    transition: background 0.2s;
  }
  h1 { font-size: 22px; margin-bottom: 6px; color: #1a3d6d; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
  .version { font-size: 11px; color: #999; }
  .row { display: flex; gap: 15px; margin-bottom: 15px; }
  .row > div { flex: 1; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #333; }
  label .hint-icon {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: #ccd2dc;
    color: #fff;
    border-radius: 50%;
    text-align: center;
    font-size: 10px;
    line-height: 14px;
    font-weight: bold;
    cursor: help;
    margin-left: 4px;
  }
  input, select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid #ccd2dc;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: #2a6fdb; outline: none; }
  input.error { border-color: #d32f2f; background: #fff5f5; }
  input.valid { border-color: #43a047; }
  .error-msg { font-size: 11px; color: #d32f2f; margin-top: 2px; display: none; }
  .error-msg.visible { display: block; }
  .btn {
    width: 100%;
    padding: 14px;
    background: #2a6fdb;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 15px;
    transition: background 0.2s;
  }
  .btn:hover { background: #1a4fa8; }
  .btn:disabled { background: #8aa9dd; cursor: wait; }
  .btn-secondary { background: #fff; color: #2a6fdb; border: 2px solid #2a6fdb; }
  .btn-secondary:hover { background: #eef3fc; }
  .btn-clear { background: #fff; color: #d32f2f; border: 2px solid #d32f2f; }
  .btn-clear:hover { background: #fdecea; }
  .btn-row { display: flex; gap: 10px; margin-top: 15px; }
  .btn-row .btn { margin-top: 0; }
  .status {
    margin-top: 15px;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  .status.ok { background: #e6f4ea; color: #1e7d38; display: block; }
  .status.err { background: #fdecea; color: #b71c1c; display: block; }
  .status.info { background: #eef3fc; color: #1a3d6d; display: block; }
  .loc-info {
    background: #eef3fc;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12px;
    color: #1a3d6d;
    margin-bottom: 15px;
    display: none;
  }
  .loc-info.visible { display: block; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .theme-toggle {
    background: none;
    border: 1px solid #ccd2dc;
    border-radius: 20px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
    color: #666;

  .theme-toggle:hover { background: #f0f2f7; }
  .next-number-btn {
    background: #eef3fc;
    color: #2a6fdb;
    border: 1px solid #2a6fdb;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 4px;
  }
  .next-number-btn:hover { background: #dfe8f7; }

  @media (max-width: 600px) {
    body { padding: 15px 10px; }
    .container { padding: 20px; }
    .row { flex-direction: column; gap: 10px; }
    h1 { font-size: 18px; }
    .btn { font-size: 14px; padding: 12px; }
    .btn-row { flex-direction: column; }
  }

  @media (prefers-color-scheme: dark) {

    .theme-toggle:hover { background: #2e333a; }

  </button>

</div>

// ============ ВСПОМОГАТЕЛЬНЫЕ ============
function getValue(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function formatDateRu(isoDate) {
  if (!isoDate) return '«___» _________ 20___ г.';
  const d = new Date(isoDate);
  const months = ['января','февраля','марта','апреля','мая','июня',
                  'июля','августа','сентября','октября','ноября','декабря'];
  return `«${d.getDate()}» ${months[d.getMonth()]} ${d.getFullYear()} г.`;
}

function onLocationChange() {
  const loc = getValue('location');
  const info = document.getElementById('locInfo');
  if (!loc || !LOCATIONS[loc]) {
    document.getElementById('discount').value = '';
    info.className = 'loc-info';
    return;
  }
  const L = LOCATIONS[loc];
  document.getElementById('discount').value = L.discount + '%';
  info.className = 'loc-info visible';
  info.innerHTML = `<b>${L.name}</b> — тип: <b>${L.type}</b><br>
    Адрес объекта: ${L.hotelAddress}<br>
    Скидка: <b>${L.discount}%</b> · Минимум: <b>${L.minNights} номеро-ночей за 12 мес.</b><br>
    Отмена: <b>${L.cancelDays} суток</b> · Оплата: ${L.paymentTerms}<br>
    Завтрак: ${L.breakfast} · SPA: ${L.spa}`;
}

function getFormData() {
  return {

    companyBank: getValue('companyBank'),
    companyBik: getValue('companyBik'),
    companyAccount: getValue('companyAccount'),
    email: getValue('email'),
    phone: getValue('phone')
  };
}

// ============ ВАЛИДАЦИЯ ============
function validateBinField() {
  const bin = getValue('companyBin');
  const field = document.getElementById('companyBin');
  const err = document.getElementById('binError');
  if (!bin) { field.classList.remove('error', 'valid'); err.classList.remove('visible'); return true; }
  const ok = /^\d{12}$/.test(bin);
  if (ok) { field.classList.remove('error'); field.classList.add('valid'); err.classList.remove('visible'); }
  else { field.classList.add('error'); field.classList.remove('valid'); err.classList.add('visible'); }
  return ok;
}

function validateEmailField() {

  const field = document.getElementById('email');
  const err = document.getElementById('emailError');
  if (!email) { field.classList.remove('error', 'valid'); err.classList.remove('visible'); return true; }
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if (ok) { field.classList.remove('error'); field.classList.add('valid'); err.classList.remove('visible'); }
  else { field.classList.add('error'); field.classList.remove('valid'); err.classList.add('visible'); }
  return ok;
}

function validatePhoneField() {
  const phone = getValue('phone');
  const field = document.getElementById('phone');
  const err = document.getElementById('phoneError');
  if (!phone) { field.classList.remove('error', 'valid'); err.classList.remove('visible'); return true; }
  const ok = /^\+?[\d\s\-()]{10,20}$/.test(phone);
  if (ok) { field.classList.remove('error'); field.classList.add('valid'); err.classList.remove('visible'); }
  else { field.classList.add('error'); field.classList.remove('valid'); err.classList.add('visible'); }
  return ok;
}

  }

// ============ АВТОЗАПОЛНЕНИЕ ПО БИН ============
async function autofillByBin(bin) {
  if (!bin || bin.length !== 12) return;
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=getByBin&bin=' + encodeURIComponent(bin));
    const data = await res.json();
    if (data.found) {
      if (data.companyName) document.getElementById('companyName').value = data.companyName;
      if (data.directorName) document.getElementById('directorName').value = data.directorName;
      if (data.companyAddress) document.getElementById('companyAddress').value = data.companyAddress;
      if (data.companyBank) document.getElementById('companyBank').value = data.companyBank;
      if (data.companyBik) document.getElementById('companyBik').value = data.companyBik;
      if (data.companyAccount) document.getElementById('companyAccount').value = data.companyAccount;

      if (data.phone) document.getElementById('phone').value = data.phone;
      saveDraft();
    }
  } catch (e) {}
}

const DRAFT_FIELDS = ['location','contractNumber','contractDate','companyName','companyBin',
                     'directorName','directorBasis','companyAddress','companyBank','companyBik',
                     'companyAccount','email','phone'];

function saveDraft() {
  DRAFT_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) localStorage.setItem('draft_' + id, el.value);
  });
}

function loadDraft() {
  DRAFT_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    const saved = localStorage.getItem('draft_' + id);
    if (el && saved) el.value = saved;
  });
}

function clearForm() {
  if (!confirm('Очистить все поля формы?')) return;
  DRAFT_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      if (id === 'directorBasis') el.value = 'Устава';
      else if (id === 'contractDate') el.value = new Date().toISOString().split('T')[0];
      else el.value = '';
    }
  });
  localStorage.clear();
  document.getElementById('locInfo').className = 'loc-info';
  document.getElementById('discount').value = '';
  document.getElementById('status').className = 'status';
  document.querySelectorAll('input').forEach(el => el.classList.remove('error', 'valid'));
}

// ============ ГЕНЕРАЦИЯ ============
async function generateAndDownload() {
  const status = document.getElementById('status');
  const btn = document.getElementById('downloadBtn');
  const loc = getValue('location');

  if (!loc || !LOCATIONS[loc]) {
    status.className = 'status err';
    status.textContent = 'Выберите локацию';
    return;
  }

  const required = ['contractNumber','contractDate','companyName','companyBin','directorName'];
  for (const id of required) {
    if (!getValue(id)) {
      status.className = 'status err';
      status.textContent = 'Заполните все обязательные поля (*)';
      return;
    }
  }

  if (!validateBinField()) { status.className = 'status err'; status.textContent = 'Проверьте БИН'; return; }
  if (!validateEmailField()) { status.className = 'status err'; status.textContent = 'Проверьте email'; return; }
  if (!validatePhoneField()) { status.className = 'status err'; status.textContent = 'Проверьте телефон'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Формирование...';
  const data = getFormData();

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch (e) { console.warn('Не удалось записать в таблицу:', e); }

  downloadWord(data);
  status.className = 'status ok';
  status.textContent = '✓ Договор сформирован. Данные отправлены в реестр.';
  btn.disabled = false;
  btn.innerHTML = '📄 Сформировать и скачать договор';
}

function previewDocument() {
  const loc = getValue('location');
  if (!loc || !LOCATIONS[loc]) { alert('Выберите локацию'); return; }
  const data = getFormData();

  const win = window.open('', '_blank');

function buildDocumentHTML(d) {
  const L = LOCATIONS[d.location];
  const dateRu = formatDateRu(d.contractDate);
  const discountFactor = ((100 - L.discount) / 100).toFixed(2);
  const docTitle = L.isB2B
    ? 'Договор об оказании гостиничных услуг'
    : 'Договор возмездного оказания гостиничных услуг';

  const content = L.isB2B
    ? buildB2B(d, L, dateRu, discountFactor, docTitle)
    : buildDirect(d, L, dateRu, discountFactor, docTitle);

  const today = new Date().toLocaleDateString('ru-RU');

  return `<html xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:w="urn:schemas-microsoft-com:office:word"
      xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8"><title>${docTitle}</title>
<style>
@page {
  size: A4;
  margin: 1.5cm 1.5cm 1.5cm 1.5cm;
  mso-page-orientation: portrait;
}
body { font-family: "Times New Roman", serif; font-size: 11pt; line-height: 1.25; margin: 0; }
h1 { font-size: 13pt; text-align: center; text-transform: uppercase; margin: 6pt 0; }
h2 { font-size: 11pt; text-transform: uppercase; margin-top: 10pt; margin-bottom: 4pt; }
p { margin: 3pt 0; text-align: justify; }
table { border-collapse: collapse; width: 100%; margin: 6pt 0; }
th, td { border: 1px solid #000; padding: 3pt 5pt; font-size: 10.5pt; vertical-align: top; }
th { background: #f0f0f0; text-align: center; }
.center { text-align: center; }
.bold { font-weight: bold; }
ul { margin: 3pt 0; padding-left: 18pt; }
li { margin: 1pt 0; }
a { color: #000; text-decoration: none; }
.doc-footer { font-size: 8pt; color: #666; text-align: right; margin-top: 10pt; }
</style></head><body>${content}
<p class="doc-footer">Редакция шаблона v${VERSION} от ${today}</p>
</body></html>`;
}

function downloadWord(d) {
  const L = LOCATIONS[d.location];
  const docTitle = L.isB2B
    ? 'Договор об оказании гостиничных услуг'
    : 'Договор возмездного оказания гостиничных услуг';

  const html = buildDocumentHTML(d);

  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${docTitle}_${d.contractNumber}_${d.companyName}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============ ШАБЛОН «ПРЯМОЙ» ============
function buildDirect(d, L, dateRu, discountFactor, docTitle) {
  return `
<h1>${docTitle} № ${d.contractNumber}</h1>
<p>г. Алматы</p>
<p>${dateRu}</p>

<p><span class="bold">${L.execFullName}</span>, именуемое в дальнейшем <span class="bold">«Исполнитель»</span>, в лице Директора ${L.execDirector}, действующего на основании ${BASIS}, с одной стороны, и</p>

<p><span class="bold">${d.companyName}</span>, именуемое в дальнейшем <span class="bold">«Заказчик»</span>, в лице ${d.directorName}, действующего на основании ${d.directorBasis}, с другой стороны,</p>

<p>совместно именуемые <span class="bold">«Стороны»</span>, заключили настоящий договор возмездного оказания гостиничных услуг (далее — <span class="bold">«Договор»</span>) о нижеследующем:</p>

<h2>1. Предмет договора</h2>
<p>1.1. По Договору Исполнитель обязуется по заявке Заказчика при наличии свободных мест оказать услуги по временному размещению гостей Заказчика (далее — <span class="bold">«Гость»</span> или <span class="bold">«Гости»</span>) в номерах гостиничного комплекса <span class="bold">«${L.hotelName}»</span>, расположенного по адресу: ${L.hotelAddress}, а Заказчик обязуется принять и оплатить оказанные услуги.</p>

<h2>2. Порядок и условия предоставления услуг</h2>
<p>2.1. Бронирование может быть совершено по электронной почте, телефону или через мессенджер WhatsApp.</p>
<p>2.2. Контакты для бронирования: e-mail: ${L.bookingEmail}, телефон: ${phoneLink(L.bookingPhone)}.</p>
<p>2.3. При бронировании необходимо внести ${L.paymentTerms}.</p>
<p>2.4. Бронирование, изменение сроков проживания, отмена брони производятся на основании письменных заявок Заказчика.</p>
<p>2.5. В течение 24 (двадцати четырёх) часов после получения заявки Исполнитель направляет Заказчику подтверждение бронирования по электронной почте или WhatsApp.</p>
<p>2.6. Заявка должна содержать: количество прибывающих лиц с ФИО; сроки пребывания с датой и временем заезда/выезда; количество и тип номеров; требования по дополнительным услугам.</p>
<p>2.7. Условия отмены бронирования регулируются разделом 5 Договора.</p>
<p>2.8. Все дополнительные услуги, не указанные в Приложении к Договору, оплачиваются дополнительно.</p>
<p>2.9. Ранним заездом считается заселение до 14:00. Поздним выездом — выезд после 12:00. Оплата:</p>
<ul>
  <li>ранний заезд 01:00–06:00 — полный тариф за предыдущие сутки;</li>
  <li>ранний заезд 06:00–14:00 — 50% суточной стоимости;</li>
  <li>поздний выезд 12:00–18:00 — 50% суточной стоимости;</li>
  <li>поздний выезд после 18:00 — полный тариф.</li>
</ul>
<p>2.10. Размещение менее 24 часов (day use) — полная суточная стоимость.</p>

<h2>3. Права и обязанности сторон</h2>
<p>3.1. Исполнитель обязуется обеспечить бронирование и размещение Гостей Заказчика по ценам Приложения к Договору.</p>
<p>3.2. Исполнитель вправе отказать в услугах при задолженности по предыдущим заявкам, отсутствии документов, нарушении порядка, алкогольном или наркотическом опьянении.</p>
<p>3.3. Заказчик обязуется своевременно подавать заявки, производить оплату, информировать Гостей о правилах проживания.</p>
<p>3.4. Заказчик вправе аннулировать заявки не позднее чем за ${L.cancelDays} суток до заезда.</p>

<h2>4. Тарифы и порядок расчётов</h2>
<p>4.1. Тарифы определяются по формуле:</p>
<p class="center bold">Корпоративный тариф = Публичный тариф (стойка) × ${discountFactor}</p>
<p>где ${discountFactor} — фиксированная корпоративная скидка ${L.discount}%.</p>
<p>4.2. Корпоративная скидка <span class="bold">${L.discount}% применяется при условии фактического размещения Гостей Заказчика в объёме не менее ${L.minNights} (${numToWords(L.minNights)}) номеро-ночей за 12 (двенадцать) месяцев с даты подписания Договора.</span></p>
<p>4.3. По истечении каждых 12 (двенадцати) месяцев с даты подписания Договора Исполнитель проводит сверку фактического объёма размещения.</p>
<p>4.4. В случае невыполнения условия п. 4.2 Договора корпоративная скидка <span class="bold">приостанавливается на следующие 12 (двенадцать) месяцев</span>. По итогам следующего периода, при выполнении условия, скидка возобновляется.</p>
<p>4.5. Скидка не аннулируется бессрочно. Приостановка действует только на один период.</p>
<p>4.6. Публичный тариф (стойка) указывается в действующем прайс-листе Исполнителя и может изменяться в порядке п. 4.7.</p>
<p>4.7. Исполнитель вправе изменять публичные тарифы в одностороннем порядке, уведомив Заказчика не менее чем за 5 (пять) календарных дней. Изменение публичных тарифов не является изменением Договора и не требует подписания дополнительного соглашения. Корпоративная скидка при этом сохраняется.</p>
<p>4.8. К бронированиям, подтверждённым до даты введения новых тарифов, применяется тариф, действовавший на дату подтверждения.</p>

<p>5.2. При отмене менее чем за ${L.cancelDays} суток — удерживается стоимость первых суток.</p>
<p>5.3. При бронировании менее чем за ${L.cancelDays} суток до заезда и последующей отмене — удерживается стоимость первых суток.</p>
<p>5.4. При незаезде без уведомления — стоимость первых суток не возвращается, последующие ночи аннулируются.</p>
<p>5.5. Изменение дат возможно при наличии свободных номеров и согласовании не менее чем за ${L.cancelDays} суток.</p>

<h2>6. Овербукинг</h2>
<p>6.1. В случае невозможности заселения Гостя по подтверждённой брони Исполнитель обязан в течение 30 минут уведомить Заказчика и предоставить альтернативное размещение того же или более высокого класса.</p>
<p>6.2. Все расходы, связанные с разницей в тарифах и транспортными услугами, компенсируются Исполнителем в полном объёме.</p>

<h2>7. Ответственность сторон</h2>
<p>7.1. При просрочке оплаты — неустойка 0,1% за каждый день просрочки. При просрочке более 14 дней Исполнитель вправе отказаться от исполнения Договора.</p>
<p>7.2. Заказчик возмещает убытки Исполнителя, включая упущенную выгоду.</p>
<p>7.3. Заказчик возмещает ущерб, причинённый Гостями имуществу Исполнителя или третьих лиц.</p>

<p>9.1. Стороны обрабатывают персональные данные Гостей исключительно в целях исполнения Договора и в соответствии с законодательством РК.</p>

<h2>10. Срок действия Договора</h2>
<p>10.1. Договор вступает в силу с момента подписания и действует <span class="bold">бессрочно</span> до момента расторжения одной из Сторон.</p>
<p>10.2. Каждая Сторона вправе расторгнуть Договор в одностороннем порядке, уведомив другую Сторону письменно не менее чем за 30 (тридцать) календарных дней.</p>
<p>10.3. Бронирования, подтверждённые до даты расторжения, обслуживаются по тарифам, действовавшим на дату подтверждения, до фактического выезда Гостей.</p>

<h2>11. Заключительные положения</h2>

<p>11.2. Договор составлен в 3 (трёх) экземплярах: два для Исполнителя, один для Заказчика.</p>

<p><em>Публичный тариф (стойка) определяется действующим прайс-листом Исполнителя на дату бронирования. Изменение публичных тарифов не требует перезаключения Договора. Корпоративная скидка ${L.discount}% сохраняется при условии, предусмотренном п. 6.3 Договора (не менее ${L.minNights} номеро-ночей за 12 месяцев с даты подписания Договора).</em></p>
<p>Тарифы включают НДС.</p>

<p><span class="bold">Дополнительно:</span></p>
<ul>
  <li>Доплата за второго человека — ${L.extraPerson} тг/сутки.</li>
  <li>Ребёнок до 7 лет — бесплатно.</li>
  <li>Ребёнок старше 7 лет — ${L.extraChild} тг/сутки.</li>
  ${L.spa === 'включена' ? '<li>SPA-зона — включена в тариф.</li>' : ''}
  <li>Высокоскоростной интернет — включён.</li>
</ul>

<h2>Условия отмены бронирования</h2>
<p>1. Для гарантированного бронирования требуется 100% предоплата.</p>
<p>2. При отмене менее чем за ${L.cancelDays} дней до заезда удерживается стоимость первых суток проживания.</p>
<p>3. При отмене более чем за ${L.cancelDays} дней до заезда предоплата возвращается в полном объёме.</p>
<p>4. При незаезде без уведомления стоимость первых суток не возвращается, последующие ночи аннулируются.</p>
<p>5. Изменение дат возможно при наличии свободных номеров и согласовании не менее чем за ${L.cancelDays} дней.</p>

// ============ ИНИЦИАЛИЗАЦИЯ ============
window.addEventListener('DOMContentLoaded', function() {
  // Автодата сегодня
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('contractDate').value = today;

  // Загрузка черновика
  loadDraft();

  // Тёмная тема
  if (localStorage.getItem('darkTheme') === '1') {
    document.body.classList.add('dark-theme');
  }

  // Сохранение черновика при вводе
  DRAFT_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', saveDraft);
  });

  // Автозаполнение по БИН
  document.getElementById('companyBin').addEventListener('blur', function() {
    const bin = this.value.trim();
    if (bin.length === 12) {
      checkDuplicate();
      autofillByBin(bin);
    }
  });
});
</script>
